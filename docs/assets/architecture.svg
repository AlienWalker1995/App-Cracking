<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="App-Cracker architecture across three tiers">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:10;}
      .tier{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;rx:14;}
      .t{fill:#0f172a;font-size:14px;}
      .lbl{fill:#334155;font-size:12px;}
      .tierlbl{font-size:13px;font-weight:700;letter-spacing:.3px;}
      .flow{stroke:#64748b;stroke-width:2;fill:none;}
      .in{fill:#ecfccb;stroke:#65a30d;}
      .out{fill:#e0e7ff;stroke:#4f46e5;}
    </style>
  </defs>

  <!-- input -->
  <rect class="card in" x="24" y="230" width="140" height="78" rx="10"/>
  <text class="t" x="94" y="262" text-anchor="middle" font-weight="700">APK / package</text>
  <text class="lbl" x="94" y="282" text-anchor="middle">acquire: full XAPK</text>
  <text class="lbl" x="94" y="298" text-anchor="middle">(base + arch + dpi)</text>

  <!-- Tier 0 -->
  <rect class="tier" x="200" y="30" width="250" height="300" rx="14"/>
  <text class="tierlbl" x="214" y="54" fill="#0369a1">TIER 0 · STATIC — no device</text>
  <rect class="card" x="216" y="66" width="218" height="40" rx="8"/>
  <text class="t" x="325" y="91" text-anchor="middle">engine + version detect</text>
  <rect class="card" x="216" y="114" width="218" height="40" rx="8"/>
  <text class="t" x="325" y="139" text-anchor="middle">IL2CPP class / method dump</text>
  <rect class="card" x="216" y="162" width="218" height="40" rx="8"/>
  <text class="t" x="325" y="187" text-anchor="middle">asset rip + type catalog</text>
  <rect class="card" x="216" y="210" width="218" height="40" rx="8"/>
  <text class="t" x="325" y="235" text-anchor="middle">endpoints + manifest</text>
  <rect class="card" x="216" y="258" width="218" height="54" rx="8"/>
  <text class="lbl" x="325" y="279" text-anchor="middle" font-weight="700" fill="#0f172a">pinned worker image</text>
  <text class="lbl" x="325" y="297" text-anchor="middle">jadx · Il2CppDumper · apktool</text>

  <!-- Tier 1 -->
  <rect class="tier" x="200" y="348" width="250" height="168" rx="14"/>
  <text class="tierlbl" x="214" y="372" fill="#b45309">TIER 1 · DYNAMIC — device you own</text>
  <rect class="card" x="216" y="384" width="218" height="40" rx="8"/>
  <text class="t" x="325" y="409" text-anchor="middle">rooted KVM emulator service</text>
  <rect class="card" x="216" y="432" width="218" height="40" rx="8"/>
  <text class="t" x="325" y="457" text-anchor="middle">Frida loader hook + RAM carve</text>
  <rect class="card" x="216" y="480" width="218" height="28" rx="8"/>
  <text class="lbl" x="325" y="499" text-anchor="middle">live SQLCipher DB · mitmproxy</text>

  <!-- Tier 2 -->
  <rect class="tier" x="486" y="150" width="210" height="180" rx="14"/>
  <text class="tierlbl" x="500" y="174" fill="#15803d">TIER 2 · SYNTHESIS</text>
  <rect class="card" x="502" y="188" width="178" height="54" rx="8"/>
  <text class="t" x="591" y="209" text-anchor="middle" font-weight="700">_digest/</text>
  <text class="lbl" x="591" y="227" text-anchor="middle">bounded, never the raw dump</text>
  <rect class="card" x="502" y="252" width="178" height="62" rx="8"/>
  <text class="t" x="591" y="274" text-anchor="middle">LLM report</text>
  <text class="lbl" x="591" y="292" text-anchor="middle">economy + how-it-works,</text>
  <text class="lbl" x="591" y="307" text-anchor="middle">sourced to evidence</text>

  <!-- Output -->
  <rect class="card out" x="732" y="210" width="144" height="120" rx="10"/>
  <text class="t" x="804" y="238" text-anchor="middle" font-weight="700">Evidence bundle</text>
  <text class="lbl" x="804" y="262" text-anchor="middle">manifest.json</text>
  <text class="lbl" x="804" y="282" text-anchor="middle">per-stage JSON/CSV</text>
  <text class="lbl" x="804" y="302" text-anchor="middle">assets · dump.cs</text>
  <text class="lbl" x="804" y="322" text-anchor="middle">+ REPORT.md</text>

  <!-- flows -->
  <path class="flow" d="M164 260 H200" marker-end="url(#arrow)"/>
  <path class="flow" d="M164 285 Q182 430 200 432" marker-end="url(#arrow)"/>
  <path class="flow" d="M450 180 H486" marker-end="url(#arrow)"/>
  <path class="flow" d="M450 432 Q470 300 486 260" marker-end="url(#arrow)"/>
  <path class="flow" d="M680 270 H732" marker-end="url(#arrow)"/>
  <path class="flow" d="M450 240 Q600 240 600 242 M450 240 H470" stroke="none"/>
  <path class="flow" d="M450 235 C520 235 560 255 732 255" marker-end="url(#arrow)"/>
</svg>
